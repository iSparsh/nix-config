name: Propose dependency updates

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.5
      - name: Refresh release pins and flake inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update-sources.py --apply
          nix flake update
          git add flake.nix flake.lock packages.json
          nix fmt
      - name: Validate updates
        run: |
          nix flake check
          bash scripts/check-profiles.sh
      - name: Save proposed changes
        run: git diff HEAD --binary -- flake.nix flake.lock packages.json > dependency-update.patch
      - uses: peter-evans/create-pull-request@v8.1.3
        id: pull_request
        continue-on-error: true
        with:
          branch: automated/dependency-updates
          title: Update pinned applications and dependencies
          commit-message: Update pinned applications and dependencies
          body: |
            Refreshes upstream release pins, application hashes, and flake dependencies.

            Formatting, integration checks, and full server/workstation evaluation passed.
            Review the version changes before merging. Running hosts update only after deployment.
          add-paths: |
            flake.nix
            flake.lock
            packages.json
      - name: Preserve changes when repository policy blocks pull requests
        if: steps.pull_request.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-update-patch
          path: dependency-update.patch
      - name: Explain repository setting
        if: steps.pull_request.outcome == 'failure'
        run: echo '::warning::Pull request creation failed. The proposed changes are attached as an artifact. Check repository Actions permissions and the create-pull-request step log.'
